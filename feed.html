<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Media App</title>
    <link rel="stylesheet" href="./public/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      .react-pop { transform-origin: center; animation: react-pop 260ms ease; }
      @keyframes react-pop { 0% { transform: scale(0.9); } 50% { transform: scale(1.28); } 100% { transform: scale(1); } }

      .dark {
        background-color: #1a202c; 
        color: #e2e8f0; 
      }
      .dark .bg-white { background-color: #2d3748; } 
      .dark .shadow, .dark .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.2); }
      .dark .text-gray-800 { color: #e2e8f0; }
      .dark .text-gray-600 { color: #a0aec0; }
      .dark .border-gray-200 { border-color: #4a5568; }
      .dark .bg-gray-100 { background-color: #1a202c; }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen text-gray-800">

    <header class="bg-white shadow sticky top-0 z-20 dark:bg-gray-800">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">

        <div class="flex items-center gap-3 flex-shrink-0">
          <div class="text-xl font-bold text-blue-600 dark:text-blue-400">Social Media App</div>
        </div>

        <div class="flex-1 hidden md:block max-w-lg">
          <input id="search-input" type="text" placeholder="Search posts..." class="w-full px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-50 dark:bg-gray-700 dark:text-white dark:border-gray-600" />
        </div>

        <div class="flex items-center gap-2 relative flex-shrink-0">
            
          <button id="mode-toggle-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none text-gray-600 dark:text-gray-300">
            <i class="fas fa-sun w-5 h-5"></i> 
          </button>
            
          <button id="profile-toggle-btn" class="flex items-center gap-1 rounded-full px-2 py-1 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none" aria-expanded="false">
            <div id="header-avatar" class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold overflow-hidden"></div>
            <span class="hidden md:inline text-sm text-gray-600 dark:text-gray-300"> <span id="header-username" class="font-medium"></span></span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500 ml-1" viewBox="0 0 20 20" fill="currentColor"><path d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/></svg>
          </button>

          <div id="profile-dropdown-menu" class="hidden absolute right-0 mt-2 w-44 bg-white rounded-md shadow-xl border border-gray-200 z-50 py-1 dark:bg-gray-800 dark:border-gray-700">
            <button id="profile-edit-menu" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-blue-500 hover:text-white flex items-center gap-2 dark:text-gray-200 dark:hover:bg-blue-600">
                <i class="fas fa-user-edit w-4"></i> Edit profile
            </button>
            <div class="border-t border-gray-100 my-1 dark:border-gray-700"></div>
            <button id="profile-logout-menu" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-100 flex items-center gap-2 dark:text-red-400 dark:hover:bg-red-900/50">
                <i class="fas fa-sign-out-alt w-4"></i> Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-1 gap-6">

      <section id="create-post" class="bg-white shadow-lg rounded-xl p-6 dark:bg-gray-800">
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold">U</div>
          <div class="flex-1">
            <h2 class="text-lg font-semibold mb-2 dark:text-white">What's on your mind?</h2>
            <textarea id="post-text" rows="3" placeholder="Share something..." class="w-full px-3 py-2 border border-gray-200 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-blue-200 bg-gray-50 dark:bg-gray-700 dark:text-white dark:border-gray-600"></textarea>
            <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <input id="post-image-url" type="text" placeholder="Image URL (optional)" class="w-full px-3 py-2 border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-200 bg-gray-50 dark:bg-gray-700 dark:text-white dark:border-gray-600" />
              </div>
              <div>
                <label class="w-full flex items-center gap-2 px-3 py-2 border border-gray-200 rounded-md cursor-pointer bg-white hover:bg-gray-50 dark:bg-gray-700 dark:hover:bg-gray-600 dark:border-gray-600">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600 dark:text-gray-300" viewBox="0 0 20 20" fill="currentColor"><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm8 4a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  <span class="text-sm text-gray-600 dark:text-gray-300">Upload image</span>
                  <input id="post-image-file" type="file" accept="image/*" class="hidden" />
                </label>
              </div>
            </div>
            <div id="image-preview" class="mt-3"></div>
            <div class="mt-3 text-right">
              <button id="post-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md">Post</button>
            </div>
          </div>
        </div>
      </section>

      <section id="controls" class="flex items-center gap-3">
        <button id="latest-sort" class="sort-btn px-3 py-1 rounded-md bg-blue-600 text-white hover:bg-blue-700">Latest</button>
        <button id="oldest-sort" class="sort-btn px-3 py-1 rounded-md bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600">Oldest</button>
        <button id="mostLiked-sort" class="sort-btn px-3 py-1 rounded-md bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600">Most Liked</button>
      </section>

      <section id="posts-container" class="space-y-4">
        </section>

    </main>

    <script src="./scripts/app.js"></script>
    <div id="profile-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-30">
      <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 dark:bg-gray-800 dark:text-white">
        <h3 class="text-lg font-semibold mb-3">Edit Profile</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1 dark:text-gray-300">Name</label>
            <input id="profile-name" type="text" class="w-full px-3 py-2 border border-gray-200 rounded dark:bg-gray-700 dark:border-gray-600" />
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1 dark:text-gray-300">Avatar</label>
            <div class="flex items-center gap-3">
              <div id="profile-avatar-preview" class="w-16 h-16 rounded-full bg-gray-100 overflow-hidden flex items-center justify-center"></div>
              <label class="px-3 py-2 border border-gray-200 rounded cursor-pointer bg-white hover:bg-gray-50 dark:bg-gray-700 dark:hover:bg-gray-600 dark:border-gray-600">Choose image<input id="profile-avatar-file" type="file" accept="image/*" class="hidden" /></label>
            </div>
          </div>
          <div class="flex justify-end gap-2">
            <button id="profile-cancel" class="px-3 py-2 rounded border dark:border-gray-600 dark:text-white dark:hover:bg-gray-700">Cancel</button>
            <button id="profile-save" class="px-3 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Save</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
