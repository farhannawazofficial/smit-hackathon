<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./public/style.css">
</head>
<body>
    <main class="min-h-screen bg-gray-100 flex items-center justify-center">
        <div class="w-full max-w-md p-6">
            <div class="bg-white shadow-md rounded-lg p-6">
                <h1 class="text-2xl font-bold text-center mb-4">Mini Social Media App</h1>
                <form class="space-y-4">
                    <input type="text" placeholder="Name" class="w-full px-3 py-2 border border-gray-300 rounded" />
                    <input type="email" placeholder="Email" class="w-full px-3 py-2 border border-gray-300 rounded" />
                    <input type="password" placeholder="Password" class="w-full px-3 py-2 border border-gray-300 rounded" />
                    <button type="submit" class="w-full bg-blue-600 text-white px-3 py-2 rounded">Login</button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">Don't have an account? Sign up</p>
            </div>
        </div>
    </main>

    <script src="./scripts/app.js"></script>
</body>
</html>
