<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Platform</title>
    <link rel="stylesheet" href="./public/style.css">
    <link rel="icon" href="./assets/images/favicon.svg" />
</head>
<body>
    <main class="min-h-screen bg-gray-100 flex items-center justify-center">
        <div class="w-full max-w-sm p-6">
            <div class="bg-white shadow-lg rounded-xl p-6">
                <h1 class="text-2xl font-semibold text-center mb-6">Login</h1>
                <form id="login-form" class="space-y-4">
                    <input id="login-email" name="email" type="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" required />
                    <input id="login-password" name="password" type="password" placeholder="Password" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" required />
                    <button id="login-btn" type="submit" class="inline-block w-full text-center mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">Login</button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">Don't have an account? <a href="./signup.html" class="text-blue-600">Sign Up</a></p>
                <div id="login-msg" class="mt-3 text-center text-sm"></div>
            </div>
        </div>
    </main>

    <script src="./scripts/app.js"></script>
</body>
</html>
