<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./public/style.css">
</head>
<body>
    <main class="min-h-screen bg-gray-100 flex items-center justify-center">
        <div class="w-full max-w-sm p-6">
            <div class="bg-white shadow-lg rounded-xl p-6">
                <h1 class="text-2xl font-semibold text-center mb-6">Mini Social App</h1>
                <form class="space-y-4">
                    <input name="name" type="text" placeholder="Name" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" />
                    <input name="email" type="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" />
                    <input name="password" type="password" placeholder="Password" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" />
                    <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">Login</button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">Don't have an account? <a href="#" class="text-blue-600">Sign Up</a></p>
            </div>
        </div>
    </main>

    <script src="./scripts/app.js"></script>
</body>
</html>
