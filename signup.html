<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Sign Up — Mini Social App</title>
	<link rel="stylesheet" href="./public/style.css">
	<link rel="icon" href="./assets/images/favicon.svg" />
</head>
<body>
	<main class="min-h-screen bg-gray-100 flex items-center justify-center">
		<div class="w-full max-w-sm p-6">
			<div class="text-center mb-4">
				<h2 class="text-3xl font-bold">Social Media App</h2>
				<p class="text-sm text-gray-500">Create your account on Social Media App</p>
			</div>
			<div class="bg-white shadow-lg rounded-xl p-6">
				<h1 class="text-2xl font-semibold text-center mb-6">Create your account</h1>
				<form id="signup-form" class="space-y-4">
					<input id="signup-name" name="name" type="text" placeholder="Full name" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" required />
					<input id="signup-email" name="email" type="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" required />
					<input id="signup-password" name="password" type="password" placeholder="Password" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200" required />
					<button id="signup-btn" type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">Sign Up</button>
				</form>
				<p class="text-center text-sm text-gray-500 mt-4">Already have an account? <a href="./index.html" class="text-blue-600">Login</a></p>
				<div id="signup-msg" class="mt-3 text-center text-sm"></div>
			</div>
		</div>
	</main>

	<script src="./scripts/app.js"></script>
</body>
</html>
